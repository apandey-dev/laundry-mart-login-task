<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Mart - Login</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- 100vh Main Container centered using Flexbox -->
    <main class="page-container">
        <div class="login-card">
            
            <!-- Left Column: 3D Illustration centered with Flexbox -->
            <section class="illustration-section">
                <img src="laundry-machine.png" alt="Laundry Machine Illustration" class="login-illustration">
            </section>

            <!-- Right Column: Interactive Login Form -->
            <section class="form-section">
                <div class="form-header">
                    <h1 class="form-title">Hello Again!</h1>
                    <p class="form-subtitle">Welcome back! we missed you!</p>
                </div>

                <form class="login-form" action="#" method="post">
                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" class="form-input" placeholder="Emailid@site.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-input" placeholder="Password" required>
                        <div class="forgot-wrapper">
                            <a href="#forgot" class="forgot-link">Forgot Password</a>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">Login</button>

                    <div class="register-prompt">
                        <p>Not a member? <a href="#register" class="register-link">Register Now</a></p>
                    </div>
                </form>
            </section>

        </div>
    </main>

</body>
</html>
